services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  bridge:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bridge:bridge@postgres/bridge
      # Required to go live; without them the service validates and exits.
      BRIDGE_MASTER_SECRET: ${BRIDGE_MASTER_SECRET:?64 hex chars; puppet key root}
      BRIDGE_PRIMARY_KEY: ${BRIDGE_PRIMARY_KEY:?nsec or hex; the invited member identity}
      BRIDGE_INVITE_URL: ${BRIDGE_INVITE_URL:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      CONCORD_CHANNEL_ID: ${CONCORD_CHANNEL_ID:-}
    restart: unless-stopped

  portal:
    build: .
    command: ["bun", "run", "packages/portal/src/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://bridge:bridge@postgres/bridge
      PORTAL_SEAL_KEY: ${PORTAL_SEAL_KEY:?64 hex chars; seals per-bridge secrets}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8787}
      PORTAL_DEV_LOGIN: ${PORTAL_DEV_LOGIN:-0}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
    restart: unless-stopped

volumes:
  pgdata:
