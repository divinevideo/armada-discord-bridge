name: Chat runtime images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bash scripts/test-image-contract.sh
      - run: python3 scripts/test-chat-image-artifacts.py
      - run: bash scripts/build-test-images.sh
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/chat-source-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-runtime-source-images
          path: ${{ runner.temp }}/chat-source-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
